[package]
name = "sp11-zbus"
description = "SP-11 throwaway: read the Mutter monitors over D-Bus with zbus"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
publish = false

# Standalone on purpose: a spike, not part of the product workspace.
[workspace]

[dependencies]
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
