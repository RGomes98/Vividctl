[package]
name = "sp11-libdbus"
description = "SP-11 throwaway: read the Mutter monitors over D-Bus with the dbus crate (libdbus)"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
publish = false

[workspace]

[dependencies]
dbus = "0.9"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
