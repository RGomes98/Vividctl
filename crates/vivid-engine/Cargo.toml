[package]
name = "vivid-engine"
description = "Use cases shared by the CLI and GUI: resolve, apply, verify, fall back, diagnose"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
# Internal crates
vivid-core = { workspace = true }
vivid-nvkms = { workspace = true }
vivid-color = { workspace = true, optional = true }
vivid-gnome = { workspace = true, optional = true }

# External crates

[features]
default = ["gnome"]
# The GNOME Shell backend needs libdbus at build time; without it only NVKMS is built.
gnome = ["dep:vivid-color", "dep:vivid-gnome"]

[lints]
workspace = true
