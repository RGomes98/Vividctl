name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # rustfmt options in rustfmt.toml (group_imports, imports_granularity) are nightly-only.
  NIGHTLY: nightly-2026-10-01

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install ${{ env.NIGHTLY }} --profile minimal --component rustfmt
      - run: cargo +${{ env.NIGHTLY }} fmt --all -- --check

  lint-and-test:
    needs: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ github.job }}-
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  budgets:
    needs: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ github.job }}-
      - run: scripts/check-budgets.sh

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-deny
            ~/.cargo/bin/cargo-machete
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: tools-deny0.20.2-machete0.9.2-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: tools-deny0.20.2-machete0.9.2-${{ runner.os }}-${{ github.job }}-
      # actions/cache restores the binaries but not cargo's install metadata, so a plain
      # `cargo install` would fail with "binary already exists". Install only if missing.
      - run: cargo deny --version 2>/dev/null | grep -q 0.20.2 || cargo install cargo-deny --locked --version 0.20.2 --force
      - run: cargo machete --version 2>/dev/null | grep -q 0.9.2 || cargo install cargo-machete --locked --version 0.9.2 --force
      - run: cargo deny check
      - run: cargo machete

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.88 --profile minimal
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ github.job }}-
      - run: cargo +1.88 check --workspace
